[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phoenixhibachi"
version = "0.1.0"
description = "Delta-neutral funding-rate arbitrage bot across Hibachi and Phoenix perp DEXes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "eth-keys>=0.5",
    "eth-utils>=4.0",
    "PyYAML>=6.0",
    "solders>=0.21",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
phxbot = "deltabot.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deltabot = ["dashboard/static/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
